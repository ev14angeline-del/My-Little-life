<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#565b48">
<meta name="description" content="A private, personal life organizer for journaling, habits, mood, periods, money, tasks, food and events.">
<link rel="manifest" href="manifest.webmanifest">
<title>My Little Life</title>
<style>
:root{--bg:#fbf8f3;--ink:#38382f;--muted:#858174;--green:#565b48;--line:#e9e3da;--card:#fff;--soft:#f0eee6;--rose:#d38f9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #89916e;outline-offset:2px}
header{padding:20px 16px 10px;max-width:1000px;margin:auto}.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#898475;text-transform:uppercase}.brand{font-size:26px;font-weight:750;letter-spacing:-.04em}.topbtn,.soft{border:0;border-radius:10px;background:var(--soft);color:#56574b;padding:9px 12px}.hero{background:#e9e8db;border-radius:18px;padding:18px;margin:15px 0}.hero h2{font-size:21px;margin:5px 0}.hero p{margin:0;color:#666658;font-size:14px}
nav{display:flex;gap:7px;overflow-x:auto;padding:5px 0 13px;scrollbar-width:thin}nav button{white-space:nowrap;border:1px solid var(--line);border-radius:20px;background:white;padding:9px 12px;color:#59574f;font-size:13px}nav button.active{background:var(--green);color:white;border-color:var(--green)}
main{max-width:1000px;margin:auto;padding:0 16px 40px}.panel{background:var(--card);border:1px solid #eee7de;border-radius:17px;padding:15px;margin:0 0 12px}.panel h2{font-size:18px;margin:0 0 12px}.panel h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted);font-size:12px}.field{display:block;width:100%;padding:11px;border:1px solid #e5dfd6;border-radius:10px;background:white;color:var(--ink);margin:5px 0 11px;min-width:0}label{font-size:12px;color:#6f6b60}.primary{background:var(--green);color:white;border:0;border-radius:11px;padding:11px 15px}.primary.full{width:100%}.secondary{background:var(--soft);color:#4e5044;border:0;border-radius:10px;padding:9px 12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{padding:13px;border-radius:13px;background:#f4f0e8;min-width:0}.tile strong{display:block;font-size:21px;margin:6px 0;overflow-wrap:anywhere}.item{padding:11px 0;border-bottom:1px solid #f0ece5;overflow-wrap:anywhere}.item:last-child{border-bottom:0}.tag{font-size:11px;padding:4px 8px;background:#f0eee5;border-radius:10px;display:inline-block}.tiny{border:0;border-radius:8px;background:#f1eee7;padding:6px 9px;color:#555}.empty{padding:17px 0;color:#8b867a;font-size:13px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.checkrow{display:flex;align-items:center;gap:9px;padding:8px 0}.checkrow input{accent-color:#646950}.photo{width:100%;max-height:250px;object-fit:cover;border-radius:10px;margin-top:7px}.bar{height:7px;background:#eeebe3;border-radius:10px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:#8c9275;border-radius:10px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.day{border:0;min-width:0;min-height:43px;border-radius:9px;background:#f6f3ed;color:#45443c;padding:4px 0;font-size:13px}.day.sel{background:var(--green);color:white}.day.now{outline:2px solid #a3a789}.day.has:after{content:'•';display:block;font-size:13px;line-height:9px;color:#b77e6e}.day.sel.has:after{color:white}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.monthtitle{font-size:18px;font-weight:650}.footer{text-align:center;color:var(--muted);font-size:11px;padding:16px 0}.notice{background:#f8f0df;border-radius:10px;padding:10px;font-size:12px;color:#766443;margin-bottom:12px}.inline-actions{display:flex;gap:7px;flex-wrap:wrap}.nowrap{white-space:nowrap}
@media(min-width:700px){.app-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.app-layout .panel{margin-bottom:0}.app-layout .wide{grid-column:1/-1}main{padding-top:8px}}
</style>
</head>
<body>
<header>
 <div class="brandrow"><div><div class="eyebrow">YOUR PERSONAL SPACE</div><div class="brand">my little life ✿</div></div><button class="topbtn" id="exportBtn">Export backup ↗</button></div>
 <section class="hero"><div class="eyebrow" id="todayLabel">A LITTLE SPACE FOR YOU</div><h2>Your life, one day at a time.</h2><p>You don't have to do everything today. Just take care of the next little thing.</p></section>
 <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="footer">My Little Life · Your data is stored on this device's browser. Export regular backups.</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=s=>{if(!s)return '';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const cats={Personal:'#879276',Birthday:'#d38f9a',Appointment:'#829eb6',Work:'#a294bd',Bill:'#c4a05c',Family:'#d39b78',Health:'#79a9a0',Celebration:'#d38f9a',Other:'#aaa69b'};
const defaults={entries:[],notes:[],habits:[],habitLogs:{},moods:[],periods:[],transactions:[],todos:[],foods:[],events:[]};
let data;
try{data={...defaults,...JSON.parse(localStorage.getItem('mll_v2')||'{}')}}catch(e){data={...defaults}}
let tab='Home',selectedDate=today(),moodDate=today(),foodDate=today(),periodDate=today(),calView=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const tabs=['Home','Journal','Notes','Habits','Mood','Period','Money','To-do','Food','Calendar'];
const icons={'Home':'⌂','Journal':'✎','Notes':'▤','Habits':'✓','Mood':'☻','Period':'♡','Money':'₹','To-do':'☷','Food':'♧','Calendar':'▦'};
function save(){try{localStorage.setItem('mll_v2',JSON.stringify(data));const el=$('saveStatus');if(el)el.textContent='Saved ✓';return true}catch(e){alert('Browser storage is full. Export a backup and remove some large photos to continue.');return false}}
function field(label,id,type='text',placeholder='',value=''){return `<label>${label}</label><input class="field" id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}">`}
function area(label,id,placeholder=''){return `<label>${label}</label><textarea class="field" id="${id}" rows="3" placeholder="${placeholder}"></textarea>`}
function select(label,id,options){return `<label>${label}</label><select class="field" id="${id}">${options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`}
function btn(text,action,cls='primary'){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function panel(title,body,wide=false){return `<section class="panel ${wide?'wide':''}"><h2>${title}</h2>${body}</section>`}
function empty(s){return `<div class="empty">${s}</div>`}
function dateField(label,id,val=today()){return field(label,id,'date','',val)}
function renderNav(){$('nav').innerHTML=tabs.map(t=>`<button data-tab="${t}" class="${t===tab?'active':''}">${icons[t]} ${t}</button>`).join('')}
function render(){renderNav();const views={Home,Journal,Notes,Habits,Mood,Period,Money,Todo,Food,Calendar};$('main').innerHTML=views[tab]();wire()}
function Home(){
 const open=data.todos.filter(x=>!x.done).length,logged=(data.habitLogs[today()]||[]).length,total=data.habits.length,foods=data.foods.filter(x=>x.date===today()),cal=foods.reduce((a,x)=>a+(+x.cal||0),0),month=today().slice(0,7),inc=data.transactions.filter(x=>x.type==='Income'&&x.date.startsWith(month)).reduce((a,x)=>a+ +x.amount,0),exp=data.transactions.filter(x=>x.type==='Expense'&&x.date.startsWith(month)).reduce((a,x)=>a+ +x.amount,0),m=data.moods.find(x=>x.date===today());
 return `<div class="muted" style="margin:0 0 10px">${fmt(today())} · YOUR DAILY CHECK-IN</div><div class="grid2" style="margin-bottom:12px"><div class="tile"><div class="muted">To-do remaining</div><strong>${open}</strong><span class="muted">little things to do</span></div><div class="tile"><div class="muted">Habits checked</div><strong>${logged}/${total}</strong><span class="muted">for today</span></div><div class="tile"><div class="muted">Food logged</div><strong>${cal}</strong><span class="muted">estimated kcal</span></div><div class="tile"><div class="muted">Monthly balance</div><strong style="font-size:19px">${money(inc-exp)}</strong><span class="muted">income minus spending</span></div></div>
 ${panel('How are you feeling today?',`<div class="row between">${[['Low','😞'],['Meh','😕'],['Okay','😐'],['Good','🙂'],['Great','🥰']].map(([n,e])=>`<button data-home-mood="${n}" class="soft" style="padding:8px 5px;flex:1;background:${m?.mood===n?'#e3e5d6':'#f7f4ef'}"><span style="font-size:22px">${e}</span><br><span style="font-size:11px">${n}</span></button>`).join('')}</div>`)}
 ${panel('Today’s little plan',`${data.todos.filter(x=>!x.done).slice(0,3).map(x=>`<div class="item">${esc(x.title)}</div>`).join('')||empty('Your list is clear. Add something small to do.')}${btn('+ Add a to-do','goto-todo','secondary')}`)}
 ${panel('A moment for yourself',`${area('What’s on your mind?','quickentry','Write a thought, memory or little win…')}${btn('Save to journal','savequick')}`)}
 ${panel('Coming up',data.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(e=>`<div class="item"><span class="dot" style="background:${cats[e.cat]||cats.Other}"></span><strong>${esc(e.title)}</strong><div class="muted">${fmt(e.date)}${e.time?' · '+esc(e.time):''}</div></div>`).join('')||empty('No upcoming events. Add important days in Calendar.'))}
 <div class="grid2">${tabs.slice(1).map(t=>`<button class="secondary" data-tab="${t}" style="text-align:left">${icons[t]} ${t} →</button>`).join('')}</div>`;
}
function Journal(){return `<div class="app-layout"><div>${panel('Write a journal entry',`<p class="muted">Capture your day, memories and pictures.</p>${dateField('Date','jdate',selectedDate)}${field('Entry title','jtitle','text','A little title for this memory')}${select('Category','jcat',[['Personal','Personal'],['Daily life','Daily life'],['Gratitude','Gratitude'],['Work & goals','Work & goals'],['Travel & memories','Travel & memories'],['Health','Health'],['Other','Other']])}${area('Your entry','jbody','What happened today? How did it feel?')}<label>Add pictures (up to 5, each under 900 KB)</label><input class="field" type="file" id="jphotos" accept="image/*" multiple>${btn('Save journal entry','savejournal')}`)}</div><div>${panel('Past entries',data.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="item"><div class="row between"><div><span class="tag">${esc(x.category)}</span><div style="font-weight:650;margin-top:7px">${esc(x.title||'Untitled entry')}</div><div class="muted">${fmt(x.date)}</div></div>${btn('Delete','del-entry-'+x.id,'tiny')}</div><p style="white-space:pre-wrap">${esc(x.body)}</p>${(x.photos||[]).map(src=>`<img class="photo" src="${src}" alt="Journal photo">`).join('')}</div>`).join('')||empty('Your story starts here. Save your first entry above.'),true)}</div></div>`}
function Notes(){return `<div class="app-layout"><div>${panel('Quick notes',`${field('Note title','ntitle','text','Remember this…')}${select('Category','ncat',[['Personal','Personal'],['Ideas','Ideas'],['Work','Work'],['Shopping','Shopping'],['Goals','Goals'],['Other','Other']])}${area('Note','nbody','Get it out of your head and onto the page.')}${btn('Save note','savenote')}`)}</div><div>${panel('Your notes',data.notes.slice().sort((a,b)=>b.created-a.created).map(n=>`<div class="item"><div class="row between"><strong>${esc(n.title||'Untitled note')}</strong>${btn('Delete','del-note-'+n.id,'tiny')}</div><span class="tag">${esc(n.cat)}</span><p style="white-space:pre-wrap">${esc(n.body)}</p><div class="muted">${fmt(n.date)}</div></div>`).join('')||empty('Your saved notes will appear here.'),true)}</div></div>`}
function Habits(){let logs=data.habitLogs[today()]||[];return `<div class="app-layout"><div>${panel('Build little routines',`${field('New habit','hname','text','e.g. Drink enough water')}${btn('Add habit','addhabit')}`)}${panel('Today’s habits',data.habits.map(h=>`<div class="checkrow"><input type="checkbox" data-habit="${h.id}" ${logs.includes(h.id)?'checked':''}><div class="grow">${esc(h.name)}<div class="muted">${Object.values(data.habitLogs).filter(a=>a.includes(h.id)).length} days completed</div></div>${btn('×','del-habit-'+h.id,'tiny')}</div>`).join('')||empty('Add one small habit to get started.'))}</div><div>${panel('Your consistency',`<p class="muted">Missing a day doesn’t erase your progress.</p><div class="item">Habits completed today <strong>${logs.length}/${data.habits.length}</strong></div><div class="bar"><span style="width:${data.habits.length?logs.length/data.habits.length*100:0}%"></span></div>`)}</div></div>`}
function Mood(){let chosen=data.moods.find(x=>x.date===moodDate);return `<div class="app-layout"><div>${panel('Mood check-in',`${dateField('Date','mdate',moodDate)}<div class="grid2">${[['Low','😞'],['Meh','😕'],['Okay','😐'],['Good','🙂'],['Great','🥰']].map(([n,e])=>`<button data-mood="${n}" class="secondary" style="padding:12px;background:${chosen?.mood===n?'#e3e5d6':'#f5f1eb'}"><span style="font-size:23px">${e}</span><br>${n}</button>`).join('')}</div>${area('Anything affecting your mood?','mnote','Sleep, people, work, something that made you smile…')}${btn('Save mood note','savemood')}`)}</div><div>${panel('Mood history',data.moods.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div class="item row between"><div><strong>${({Low:'😞',Meh:'😕',Okay:'😐',Good:'🙂',Great:'🥰'})[m.mood]} ${esc(m.mood)}</strong><div class="muted">${fmt(m.date)}</div>${m.note?`<p>${esc(m.note)}</p>`:''}</div>${btn('Delete','del-mood-'+m.id,'tiny')}</div>`).join('')||empty('Your mood history will grow with each check-in.'),true)}</div></div>`}
function Period(){let ps=data.periods.slice().sort((a,b)=>b.start.localeCompare(a.start));return `<div class="app-layout"><div>${panel('Period log',`<p class="muted">Record period start/end dates and symptoms.</p>${dateField('Period started','pstart',periodDate)}${field('End date (optional)','pend','date','',ps[0]?.end||'')}${area('Symptoms or notes','pnotes','Cramps, flow, energy, anything to remember.')}${btn('Save period record','saveperiod')}`)}${panel('Cycle note',`<p class="text-sm">Once you have several records, compare the days between start dates. Estimates are approximate and should not be used as contraception.</p>`)}</div><div>${panel('Cycle history',ps.map(p=>`<div class="item"><strong>♡ ${fmt(p.start)}${p.end?' – '+fmt(p.end):' · end date not added'}</strong>${p.notes?`<p>${esc(p.notes)}</p>`:''}${btn('Delete','del-period-'+p.id,'tiny')}</div>`).join('')||empty('No period dates logged yet.'),true)}</div></div>`}
function Money(){let month=today().slice(0,7),tx=data.transactions.filter(t=>t.date.startsWith(month)),inc=tx.filter(t=>t.type==='Income').reduce((a,t)=>a+ +t.amount,0),exp=tx.filter(t=>t.type==='Expense').reduce((a,t)=>a+ +t.amount,0);return `<div class="app-layout"><div>${panel('Your money this month',`<div class="grid2"><div class="tile"><span class="muted">Income</span><strong style="font-size:20px">${money(inc)}</strong></div><div class="tile"><span class="muted">Expenses</span><strong style="font-size:20px">${money(exp)}</strong></div></div><div class="item" style="margin-top:8px"><span class="muted">Money left (income − expenses)</span><div style="font-size:22px;font-weight:700">${money(inc-exp)}</div></div>`) }${panel('Add a transaction',`${dateField('Date','txdate')}${select('Type','txtype',[['Expense','Expense'],['Income','Income']])}${field('Amount (₹)','txamount','number','0')}${field('What was it for?','txdesc','text','Groceries, salary, bus fare')}${select('Category','txcat',[['Food','Food'],['Travel','Travel'],['Bills','Bills'],['Shopping','Shopping'],['Health','Health'],['Home','Home'],['Salary','Salary'],['Savings','Savings'],['Other','Other']])}${btn('Save transaction','savetransaction')}`)}</div><div>${panel('Transactions',data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item row between"><div><strong>${esc(t.desc)}</strong><div class="muted">${fmt(t.date)} · ${esc(t.cat)}</div></div><div style="text-align:right;color:${t.type==='Income'?'#5e7955':'#9a5b51'}">${t.type==='Income'?'+':'−'}${money(t.amount)}<br>${btn('×','del-tx-'+t.id,'tiny')}</div></div>`).join('')||empty('Track expenses and income here.'),true)}</div></div>`}
function Todo(){return `<div class="app-layout"><div>${panel('Your to-do list',`${field('What do you need to do?','tdtitle','text','One thing at a time…')}${dateField('Due date','tddate')}${select('Priority','tdpriority',[['Normal','Normal'],['Important','Important'],['Whenever','Whenever']])}${btn('Add to list','addtodo')}`)}${panel('Still to do',data.todos.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<div class="checkrow"><input type="checkbox" data-todo="${t.id}"><div class="grow">${esc(t.title)}<div class="muted">${fmt(t.date)} · ${esc(t.priority)}</div></div>${btn('×','del-todo-'+t.id,'tiny')}</div>`).join('')||empty('Nothing pending. Take a breath.'))}</div><div>${panel('Completed',data.todos.filter(x=>x.done).map(t=>`<div class="checkrow"><input type="checkbox" data-todo="${t.id}" checked><div class="grow" style="text-decoration:line-through">${esc(t.title)}</div>${btn('×','del-todo-'+t.id,'tiny')}</div>`).join('')||empty('Finished tasks will appear here.'),true)}</div></div>`}
function Food(){let day=data.foods.filter(x=>x.date===foodDate),cal=day.reduce((a,x)=>a+ +x.cal,0),protein=day.reduce((a,x)=>a+ +x.protein,0);return `<div class="app-layout"><div>${panel('Food diary',`${dateField('Day','fooddate',foodDate)}<div class="grid2"><div class="tile"><span class="muted">Estimated calories</span><strong>${cal}</strong><span class="muted">kcal logged</span></div><div class="tile"><span class="muted">Protein</span><strong>${protein} g</strong><span class="muted">estimated</span></div></div><p class="muted" style="margin:10px 0">Record food without judgment. Nutrition values are estimates.</p>${field('Food or drink','foodname','text','e.g. 2 eggs and chapati')}${field('Calories (optional)','foodcal','number','Estimated kcal')}${field('Protein in grams (optional)','foodprotein','number','Estimated protein')}${select('Meal','foodmeal',[['Breakfast','Breakfast'],['Lunch','Lunch'],['Snack','Snack'],['Dinner','Dinner'],['Drink','Drink'],['Other','Other']])}${btn('Log food','savefood')}`)}</div><div>${panel('Food logged · '+fmt(foodDate),day.map(f=>`<div class="item row between"><div><span class="tag">${esc(f.meal)}</span><div style="font-weight:650;margin-top:5px">${esc(f.name)}</div><div class="muted">${f.cal?esc(f.cal)+' kcal':''}${f.cal&&f.protein?' · ':''}${f.protein?esc(f.protein)+' g protein':''}</div></div>${btn('×','del-food-'+f.id,'tiny')}</div>`).join('')||empty('Nothing logged for this date yet.'),true)}${panel('A gentle note',`<p class="text-sm">You don't need to count every calorie to eat well. This diary can simply help you notice meals and patterns.</p>`)}</div></div>`}
function Calendar(){let first=new Date(calView.getFullYear(),calView.getMonth(),1),offset=(first.getDay()+6)%7,days=new Date(calView.getFullYear(),calView.getMonth()+1,0).getDate(),html='';for(let i=0;i<offset;i++)html+='<div></div>';for(let d=1;d<=days;d++){let dt=new Date(calView.getFullYear(),calView.getMonth(),d,12),k=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`,has=dayEvents(k).length>0;html+=`<button class="day ${k===selectedDate?'sel':''} ${k===today()?'now':''} ${has?'has':''}" data-caldate="${k}">${d}</button>`}
 return `<div class="app-layout"><div>${panel('Your calendar',`<div class="calendar-head"><button class="soft" data-action="calprev">←</button><div class="monthtitle">${calView.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><button class="soft" data-action="calnext">→</button></div><div class="days muted" style="margin-bottom:8px"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div><div class="days" id="calDays">${html}</div><p class="muted" style="text-align:center;margin-top:10px">Dots mark days with events.</p><button class="secondary" data-action="caltoday">Go to today</button>` )}${panel('Add an important day',`${field('Event or occasion','evtitle','text',"e.g. Mum's birthday")}${dateField('Date','evdate',selectedDate)}${field('Time (optional)','evtime','time')}${select('Category','evcat',[['Personal','Personal'],['Birthday','Birthday'],['Appointment','Appointment'],['Work','Work & deadlines'],['Bill','Bills & payments'],['Family','Family'],['Health','Health'],['Celebration','Celebration'],['Other','Other']])}${area('Notes (optional)','evnotes','Address, what to bring, gift ideas…')}<label class="checkrow"><input type="checkbox" id="evrepeat"> Repeat yearly</label>${btn('Save event','saveevent')}`)}</div><div><section class="panel"><div class="muted">SELECTED DATE</div><h2 style="margin-top:4px">${fmt(selectedDate)}</h2><div id="selectedEvents">${eventMarkup(dayEvents(selectedDate))}</div></section>${panel('Coming up next',data.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10).map(e=>`<div class="item row"><div style="min-width:48px;text-align:center;background:#f3f0e9;border-radius:9px;padding:7px"><div class="muted">${parseDate(e.date).toLocaleDateString(undefined,{month:'short'}).toUpperCase()}</div><strong>${parseDate(e.date).getDate()}</strong></div><div class="grow"><strong>${esc(e.title)}</strong><div class="muted">${esc(e.cat)}${e.time?' · '+esc(e.time):''}${e.repeat?' · yearly':''}</div></div></div>`).join('')||empty('Your upcoming plans will appear here.'),true)}</div></div>`}
function parseDate(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function dayEvents(d){return data.events.filter(e=>e.date===d||(e.repeat&&e.date.slice(5)===d.slice(5))).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function eventMarkup(arr){return arr.length?arr.map(e=>`<div class="item"><div class="row between"><div class="grow"><span class="dot" style="background:${cats[e.cat]||cats.Other}"></span><strong>${esc(e.title)}</strong><div class="muted">${esc(e.cat)}${e.time?' · '+esc(e.time):''}${e.repeat?' · Every year':''}</div>${e.notes?`<p>${esc(e.notes)}</p>`:''}</div>${btn('Delete','del-event-'+e.id,'tiny')}</div></div>`).join(''):empty('No events planned for this day. Add one below.')}
function wire(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
 document.querySelectorAll('[data-home-mood]').forEach(b=>b.onclick=()=>{upsertMood(today(),b.dataset.homeMood,'');render()});
 document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{const d=$('mdate')?.value||moodDate;moodDate=d;upsertMood(d,b.dataset.mood,$('mnote')?.value||'');render()});
 document.querySelectorAll('[data-habit]').forEach(b=>b.onchange=()=>{let a=data.habitLogs[today()]||[];data.habitLogs[today()]=b.checked?[...new Set([...a,b.dataset.habit])]:a.filter(x=>x!==b.dataset.habit);save();render()});
 document.querySelectorAll('[data-todo]').forEach(b=>b.onchange=()=>{let t=data.todos.find(x=>x.id===b.dataset.todo);if(t)t.done=b.checked;save();render()});
 document.querySelectorAll('[data-caldate]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.caldate;render()});
 ['jdate','mdate','pstart','fooddate','evdate'].forEach(id=>{let el=$(id);if(el)el.onchange=()=>{if(id==='jdate')selectedDate=el.value;if(id==='mdate')moodDate=el.value;if(id==='pstart')periodDate=el.value;if(id==='fooddate')foodDate=el.value;if(id==='evdate')selectedDate=el.value;if(id==='evdate'){calView=new Date(parseDate(el.value).getFullYear(),parseDate(el.value).getMonth(),1)}render()}});
}
function upsertMood(date,mood,note){let m=data.moods.find(x=>x.date===date);if(m){m.mood=mood;if(note)m.note=note}else data.moods.push({id:uid(),date,mood,note});save()}
function act(a){
 if(a==='goto-todo'){tab='To-do';render();return}
 if(a==='calprev'){calView=new Date(calView.getFullYear(),calView.getMonth()-1,1);render();return}
 if(a==='calnext'){calView=new Date(calView.getFullYear(),calView.getMonth()+1,1);render();return}
 if(a==='caltoday'){selectedDate=today();calView=new Date(new Date().getFullYear(),new Date().getMonth(),1);render();return}
 if(a==='savequick'){let body=$('quickentry')?.value.trim();if(body){data.entries.push({id:uid(),date:today(),title:'A little thought',category:'Daily life',body,photos:[]});save();render()}return}
 if(a==='savejournal'){let files=Array.from($('jphotos').files||[]);if(files.length>5){alert('Please select up to 5 pictures.');return}Promise.all(files.map(file=>new Promise((resolve,reject)=>{if(file.size>900000){reject(Error('Choose pictures under 900 KB each or resize them first.'));return}let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)}))).then(photos=>{data.entries.push({id:uid(),date:$('jdate').value||today(),title:$('jtitle').value.trim(),category:$('jcat').value,body:$('jbody').value,photos});if(save())render()}).catch(e=>alert(e.message||'Could not load pictures.'));return}
 if(a==='savenote'){if(!$('nbody').value.trim()&&!$('ntitle').value.trim())return;data.notes.push({id:uid(),title:$('ntitle').value,cat:$('ncat').value,body:$('nbody').value,date:today(),created:Date.now()});save();render();return}
 if(a==='addhabit'){let n=$('hname').value.trim();if(n){data.habits.push({id:uid(),name:n});save();render()}return}
 if(a==='savemood'){upsertMood($('mdate').value||today(),data.moods.find(x=>x.date===($('mdate').value||today()))?.mood||'Okay',$('mnote').value);render();return}
 if(a==='saveperiod'){let start=$('pstart').value;if(!start){alert('Please choose the start date.');return}data.periods.push({id:uid(),start,end:$('pend').value,notes:$('pnotes').value});save();render();return}
 if(a==='savetransaction'){let amount=+$('txamount').value;if(!amount||amount<0){alert('Enter an amount greater than zero.');return}data.transactions.push({id:uid(),date:$('txdate').value||today(),type:$('txtype').value,amount,desc:$('txdesc').value.trim()||'Transaction',cat:$('txcat').value});save();render();return}
 if(a==='addtodo'){let title=$('tdtitle').value.trim();if(title){data.todos.push({id:uid(),title,date:$('tddate').value||today(),priority:$('tdpriority').value,done:false});save();render()}return}
 if(a==='savefood'){let name=$('foodname').value.trim();if(name){data.foods.push({id:uid(),date:$('fooddate').value||today(),name,cal:Math.max(0,+$('foodcal').value||0),protein:Math.max(0,+$('foodprotein').value||0),meal:$('foodmeal').value});save();render()}return}
 if(a==='saveevent'){let title=$('evtitle').value.trim(),date=$('evdate').value;if(!title||!date){alert('Please enter an event name and date.');return}data.events.push({id:uid(),title,date,time:$('evtime').value,cat:$('evcat').value,notes:$('evnotes').value.trim(),repeat:$('evrepeat').checked});selectedDate=date;calView=new Date(parseDate(date).getFullYear(),parseDate(date).getMonth(),1);save();render();return}
 if(a.startsWith('del-')){let rest=a.slice(4),i=rest.indexOf('-'),kind=rest.slice(0,i),id=rest.slice(i+1),map={entry:'entries',note:'notes',mood:'moods',period:'periods',tx:'transactions',todo:'todos',food:'foods',habit:'habits',event:'events'},key=map[kind];if(key){data[key]=data[key].filter(x=>x.id!==id);if(kind==='habit')Object.keys(data.habitLogs).forEach(d=>data.habitLogs[d]=data.habitLogs[d].filter(h=>h!==id));save();render()}return}
}
$('todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-little-life-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
